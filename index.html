<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schackvisare</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            padding: 20px;
        }

        #info-container {
            background: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

            #info-container h2 {
                margin: 0 0 10px 0;
                font-size: 1.2rem;
            }

            #info-container p {
                margin: 4px 0;
                color: #555;
            }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-template-rows: repeat(8, 50px);
            border: 3px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .square {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            user-select: none;
        }

        .white-square {
            background-color: #f0d9b5;
        }

        .black-square {
            background-color: #b58863;
        }

        #controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

            button:disabled {
                background-color: #ccc;
                cursor: not-allowed;
            }

            button:hover:not(:disabled) {
                background-color: #45a049;
            }

        #move-counter {
            font-weight: bold;
            min-width: 100px;
            text-align: center;
        }

        #error-message {
            color: red;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="info-container">
        <h2 id="game-title">Laddar parti...</h2>
        <p id="game-date"></p>
        <p id="game-players"></p>
    </div>

    <div id="board"></div>

    <div id="controls">
        <button id="prev-btn" onclick="prevMove()" disabled>Föregående</button>
        <span id="move-counter">Drag: 0</span>
        <button id="next-btn" onclick="nextMove()" disabled>Nästa</button>
    </div>

    <div id="error-message"></div>

    <script>
        // Unicode-symboler för schackpjäser
        const PIECES = {
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙', // Vita
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟'  // Svarta
        };

        // Ursprunglig uppställning
        const INITIAL_BOARD = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
        ];

        let moveHistory = []; // Innehåller brädets tillstånd efter varje drag
        let movesList = [];
        let currentMoveIndex = 0;

        // Hämta querystring parameter (t.ex. ?file=game.txt)
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        if (!fileName) {
            showError("Ingen fil angiven i url:en. Använd t.ex. ?file=game.txt");
        } else {
            loadGameFile(fileName);
        }

        async function loadGameFile(file) {
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error(`Kunde inte ladda filen: ${response.statusText}`);

                const text = await response.text();
                parseAndInitGame(text.trim());
            } catch (err) {
                showError("Fel vid inläsning av filen: " + err.message);
            }
        }

        function parseAndInitGame(data) {
            const parts = data.split(';');
            if (parts.length < 4) {
                showError("Filformatet är ogiltigt.");
                return;
            }

            const title = parts[0];
            const date = parts[1];
            const whitePlayer = parts[2];
            const blackPlayer = parts[3];
            movesList = parts.slice(4).filter(m => m.trim() !== "");

            // Uppdatera info-gränssnittet
            document.getElementById('game-title').innerText = title;
            document.getElementById('game-date').innerText = `Startdatum: ${date}`;
            document.getElementById('game-players').innerText = `Vit: ${whitePlayer} - Svart:${blackPlayer}`;

            // Generera historiken över alla brädtillstånd
            buildMoveHistory();

            // Rendera startpositionen
            renderBoard();
            updateControls();
        }

        function parseCoordinate(coordStr) {
            // Omvandlar t.ex. "H2" till matrisindex [row, col]
            const colLetter = coordStr.charAt(0).toUpperCase();
            const rowNum = parseInt(coordStr.charAt(1), 10);

            const col = colLetter.charCodeAt(0) - 'A'.charCodeAt(0);
            const row = 8 - rowNum;
            return { row, col };
        }

        function buildMoveHistory() {
            // Djupkopiera startbrädet
            let currentBoard = INITIAL_BOARD.map(row => [...row]);
            moveHistory.push(currentBoard.map(row => [...row]));

            for (let move of movesList) {
                const [fromStr, toStr] = move.split('-');
                if (!fromStr || !toStr) continue;

                const from = parseCoordinate(fromStr);
                const to = parseCoordinate(toStr);

                let piece = currentBoard[from.row][from.col];

                // Töm ursprungsrutan och placera pjäsen på målrutan
                currentBoard[from.row][from.col] = '';
                currentBoard[to.row][to.col] = piece;

                // --- Speciallogik 1: Rockad ---
                if ((piece === 'K' || piece === 'k') && Math.abs(from.col - to.col) === 2) {
                    if (to.col > from.col) { // Kort rockad
                        const rook = currentBoard[from.row][7];
                        currentBoard[from.row][7] = '';
                        currentBoard[from.row][5] = rook;
                    } else if (to.col < from.col) { // Lång rockad
                        const rook = currentBoard[from.row][0];
                        currentBoard[from.row][0] = '';
                        currentBoard[from.row][3] = rook;
                    }
                }

                // --- Speciallogik 2: Bondepromovorering (blir Drottning) ---
                // Vit bonde 'P' som når rad 0 (rad 8 på brädet)
                if (piece === 'P' && to.row === 0) {
                    currentBoard[to.row][to.col] = 'Q';
                }
                // Svart bonde 'p' som når rad 7 (rad 1 på brädet)
                if (piece === 'p' && to.row === 7) {
                    currentBoard[to.row][to.col] = 'q';
                }

                // Spara det nya tillståndet i historiken
                moveHistory.push(currentBoard.map(row => [...row]));
            }
        }

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';

            const boardState = moveHistory[currentMoveIndex];

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isWhiteSquare = (r + c) % 2 === 0;
                    square.className = `square ${isWhiteSquare ? 'white-square' : 'black-square'}`;

                    const pieceKey = boardState[r][c];
                    if (pieceKey) {
                        square.innerText = PIECES[pieceKey] || pieceKey;
                    }

                    boardElement.appendChild(square);
                }
            }
        }

        function updateControls() {
            document.getElementById('move-counter').innerText = `Drag: ${currentMoveIndex}/${moveHistory.length - 1}`;
            document.getElementById('prev-btn').disabled = currentMoveIndex === 0;
            document.getElementById('next-btn').disabled = currentMoveIndex === moveHistory.length - 1;
        }

        function nextMove() {
            if (currentMoveIndex < moveHistory.length - 1) {
                currentMoveIndex++;
                renderBoard();
                updateControls();
            }
        }

        function prevMove() {
            if (currentMoveIndex > 0) {
                currentMoveIndex--;
                renderBoard();
                updateControls();
            }
        }

        function showError(msg) {
            document.getElementById('game-title').innerText = "Ett fel uppstod";
            document.getElementById('error-message').innerText = msg;
        }
    </script>
</body>
</html>
